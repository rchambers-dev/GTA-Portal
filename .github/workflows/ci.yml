name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Chrome
        run: google-chrome --version || (sudo apt-get update && sudo apt-get install -y google-chrome-stable)
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test
